<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Hứng Vật Phẩm 2D</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Khởi tạo người chơi (cái giỏ)
    let catcher = {
        x: canvas.width / 2 - 50,
        y: canvas.height - 50,
        width: 100,
        height: 20,
        speed: 8,
        dx: 0
    };

    // Khởi tạo vật phẩm rơi
    let item = {
        x: Math.random() * (canvas.width - 30),
        y: -30,
        radius: 15,
        speed: 4
    };

    let score = 0;
    let lives = 3;
    let isGameOver = false;

    // Lắng nghe bàn phím
    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener("keydown", (e) => {
        if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
        if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
    });

    document.addEventListener("keyup", (e) => {
        if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
        if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
    });

    function update() {
        if (isGameOver) return;

        // Di chuyển giỏ
        if (rightPressed && catcher.x + catcher.width < canvas.width) {
            catcher.x += catcher.speed;
        } else if (leftPressed && catcher.x > 0) {
            catcher.x -= catcher.speed;
        }

        // Vật phẩm rơi xuống
        item.y += item.speed;

        // Kiểm tra bắt trúng vật phẩm
        if (
            item.y + item.radius >= catcher.y &&
            item.x >= catcher.x &&
            item.x <= catcher.x + catcher.width
        ) {
            score += 10;
            resetItem();
            // Tăng tốc độ dần khi điểm cao lên
            item.speed += 0.2;
        }

        // Kiểm tra rơi chạm đáy
        if (item.y > canvas.height) {
            lives--;
            resetItem();
            if (lives <= 0) {
                isGameOver = true;
            }
        }
    }

    function resetItem() {
        item.y = -30;
        item.x = Math.random() * (canvas.width - 30);
    }

    function draw() {
        // Xóa màn hình cũ
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ người chơi (Giỏ)
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(catcher.x, catcher.y, catcher.width, catcher.height);

        // Vẽ vật phẩm (Quả bóng/Ngôi sao)
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff0055";
        ctx.fill();
        ctx.closePath();

        // Hiển thị Điểm và Mạng
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Điểm: " + score, 20, 30);
        ctx.fillText("Mạng: " + lives, canvas.width - 100, 30);

        // Nếu thua cuộc
        if (isGameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "18px Arial";
            ctx.fillText("Nhấn F5 để chơi lại", canvas.width / 2, canvas.height / 2 + 20);
            ctx.textAlign = "left";
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
